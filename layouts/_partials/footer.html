<footer class="perfcheck-footer">
  <div class="perfcheck-container perfcheck-footer__inner">
    <p class="perfcheck-footer__copy">
      &copy; {{ now.Year }} {{ site.Title }}. Built with Hugo, Go and React.
    </p>
    <ul class="perfcheck-footer__list">
      <li><a class="perfcheck-footer__link" href="{{ "about/" | relURL }}">About</a></li>
      <li><a class="perfcheck-footer__link" href="{{ "how-it-works/" | relURL }}">How it works</a></li>
      {{ with site.Params.social.github }}
        <li><a class="perfcheck-footer__link" href="{{ . }}" rel="noopener noreferrer">GitHub</a></li>
      {{ end }}
    </ul>
  </div>
</footer>
