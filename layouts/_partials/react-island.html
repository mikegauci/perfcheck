{{- $component := .component -}}
<div
  class="perfcheck-island perfcheck-island--{{ $component }}"
  data-react-island
  data-component="{{ $component }}"
  aria-busy="true"
>
  <noscript>
    <div class="perfcheck-alert perfcheck-alert--info" role="status">
      <p class="perfcheck-alert__title">JavaScript required</p>
      <p class="perfcheck-alert__body">This interactive tool needs JavaScript. The rest of the site works without it.</p>
    </div>
  </noscript>
  <div class="perfcheck-island__root" data-island-root>
    <div class="perfcheck-island__fallback" inert>
      {{ partial "island-fallback.html" $component }}
    </div>
  </div>
</div>
