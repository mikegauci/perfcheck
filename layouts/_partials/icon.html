{{- $name := . -}}
<span class="perfcheck-icon" aria-hidden="true">
  {{- if eq $name "url" -}}
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" focusable="false">
      <rect x="3" y="7" width="18" height="10" rx="1"/>
      <path d="M6 12h7"/>
      <path d="M14 10.5v3"/>
    </svg>
  {{- else if eq $name "document" -}}
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" focusable="false">
      <path d="M7 3.5h7.5L19 8v12.5H7z"/>
      <path d="M14.5 3.5V8H19"/>
      <path d="M10 12h6M10 15.5h4"/>
    </svg>
  {{- else if eq $name "island" -}}
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" focusable="false">
      <rect x="3.5" y="3.5" width="17" height="17"/>
      <rect x="8" y="8" width="8" height="8"/>
    </svg>
  {{- else if eq $name "api" -}}
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" focusable="false">
      <path d="M8 5H6v14h2"/>
      <path d="M16 5h2v14h-2"/>
      <path d="M9.5 12h5"/>
    </svg>
  {{- else if eq $name "ledger" -}}
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" focusable="false">
      <path d="M5 7h14M5 12h10M5 17h6"/>
    </svg>
  {{- else if eq $name "tick" -}}
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" focusable="false">
      <path d="M6 18V14M12 18V9M18 18V5"/>
    </svg>
  {{- else if eq $name "split" -}}
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" focusable="false">
      <rect x="3.5" y="4" width="7" height="16"/>
      <rect x="13.5" y="4" width="7" height="16"/>
    </svg>
  {{- else if eq $name "git" -}}
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.5" focusable="false">
      <circle cx="12" cy="5" r="1.75"/>
      <circle cx="7" cy="19" r="1.75"/>
      <circle cx="17" cy="19" r="1.75"/>
      <path d="M12 7v4.5L7.5 17M12 11.5L16.5 17"/>
    </svg>
  {{- end -}}
</span>
