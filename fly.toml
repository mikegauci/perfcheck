# Fly.io deploy config — one process serves Hugo public/ and the Go API.
app = "perfcheck-mikegauci"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"
  [build.args]
    HUGO_BASEURL = "https://perfcheck-mikegauci.fly.dev/"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "perfcheck_data"
  destination = "/data"
  initial_size = "1gb"
