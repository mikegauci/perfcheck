baseURL = 'http://localhost:1313/'
title = 'PerfCheck'
defaultContentLanguage = 'en'
enableRobotsTXT = true
canonifyURLs = false
disableKinds = ['taxonomy', 'term']

[languages.en]
  locale = 'en-GB'
  label = 'English'
  weight = 1

[params]
  description = 'Mock website performance, SEO and accessibility audits — a portfolio project demonstrating Hugo, Go and React.'
  apiBaseUrl = 'http://localhost:8080'
  author = 'mikegauci'

[params.social]
  github = 'https://github.com/mikegauci/perfcheck'

[markup.goldmark.renderer]
  unsafe = false

[outputs]
  home = ['HTML', 'RSS']
  page = ['HTML']

[minify]
  minifyOutput = true
