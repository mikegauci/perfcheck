name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -race -count=1 -cover
      - name: Pure-Go build
        env:
          CGO_ENABLED: '0'
        run: go build -o /tmp/perfcheckd ./cmd/perfcheckd

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test -- --coverage

  hugo:
    name: Hugo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.165.0'
          extended: true
      - name: Setup Dart Sass
        run: |
          curl -fsSL https://github.com/sass/dart-sass/releases/download/1.77.8/dart-sass-1.77.8-linux-x64.tar.gz | sudo tar -xz -C /usr/local/bin --strip-components=1
          sass --version
      - name: Build
        run: hugo --minify
        env:
          HUGO_PARAMS_APIBASEURL: ''
